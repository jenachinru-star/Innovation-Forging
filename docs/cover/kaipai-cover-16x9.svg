<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="worklight" cx="76%" cy="18%" r="72%">
      <stop offset="0" stop-color="#d6a348" stop-opacity=".22"/>
      <stop offset=".42" stop-color="#6d4a22" stop-opacity=".08"/>
      <stop offset="1" stop-color="#11100e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperGlow" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#e8e0d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d8c9b1" stroke-opacity=".12"/>
    </pattern>
    <style>
      .serif { font-family: "Source Han Serif SC", "Songti SC", "STSong", serif; }
      .sans { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "Cascadia Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#11100e"/>
  <rect width="1280" height="720" fill="url(#worklight)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <g opacity=".28" stroke="#c18a2d">
    <line x1="0" y1="88" x2="1280" y2="88"/>
    <line x1="0" y1="632" x2="1280" y2="632"/>
  </g>
  <rect x="72" y="55" width="6" height="610" fill="#c18a2d"/>

  <g transform="translate(112 94)">
    <rect x="0" y="0" width="4" height="46" fill="#c18a2d"/>
    <text x="18" y="34" fill="#f2e8da" font-size="34" class="serif" font-weight="700">开排</text>
    <text x="92" y="31" fill="#9b9082" font-size="12" letter-spacing="4" class="sans">舞台制作工作台</text>
  </g>

  <text x="110" y="238" fill="#f2ede4" font-size="72" font-family="Source Han Serif SC, Songti SC, STSong, serif" font-weight="700" letter-spacing="-2">
    把零散想法，
  </text>
  <text x="110" y="318" fill="#f2ede4" font-size="72" font-family="Source Han Serif SC, Songti SC, STSong, serif" font-weight="700" letter-spacing="-2">
    变成可执行的排演材料
  </text>
  <text x="112" y="365" fill="#a99d8d" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    剧本 · 场次 · 人物 · 走位 · 提示 · 部门 · 视觉 · 交付
  </text>

  <g transform="translate(112 442)">
    <rect width="260" height="2" fill="#3b332b"/>
    <text x="0" y="29" fill="#c18a2d" font-size="11" letter-spacing="3" class="mono">CUE 01 · 剧本是唯一事实源</text>
    <text x="0" y="54" fill="#c8bcae" font-size="15" class="sans">修改原文后，关联提示与资产进入影响队列</text>
  </g>

  <g transform="translate(690 88)" filter="url(#shadow)">
    <rect width="500" height="530" fill="url(#paperGlow)" stroke="#d3cabc"/>

    <rect width="90" height="530" fill="#181613"/>
    <rect x="18" y="22" width="30" height="4" fill="#c18a2d"/>
    <g fill="#6f665b" font-size="9" class="mono">
      <text x="18" y="50">00 总览</text>
      <text x="18" y="78" fill="#f2e8da">01 剧本</text>
      <text x="18" y="106">02 拆解</text>
      <text x="18" y="134">03 排演</text>
      <text x="18" y="162">04 部门</text>
      <text x="18" y="190">05 排练</text>
      <text x="18" y="218">06 视觉</text>
      <text x="18" y="246">07 交付</text>
    </g>

    <g transform="translate(118 32)">
      <text fill="#b23b32" font-size="9" letter-spacing="2" class="mono">02 · 剧本拆解</text>
      <text y="37" fill="#1c1917" font-size="24" class="serif" font-weight="700">第一场 · 客厅</text>
      <text y="64" fill="#746c61" font-size="10" class="sans">老陈 / 阿岚 · 6 分钟 · 铺垫</text>
      <line x1="0" y1="84" x2="350" y2="84" stroke="#d3cabc"/>

      <g transform="translate(0 108)" fill="#1c1917" class="serif">
        <text font-size="9" fill="#b23b32" class="sans">老陈</text>
        <text y="23" font-size="17">你终于回来了。</text>
        <text y="68" font-size="9" fill="#55715b" class="sans">阿岚</text>
        <text y="91" font-size="17">爸，我回来了。</text>
        <text y="136" font-size="12" fill="#746c61">（灯光转暖，落在桌上的钥匙上。）</text>
        <text y="181" font-size="9" fill="#b23b32" class="sans">老陈</text>
        <text y="204" font-size="17">这是你妈留下的那把。</text>
      </g>

      <g transform="translate(273 106)">
        <rect width="72" height="34" fill="#d8b96f"/>
        <text x="9" y="21" fill="#261c10" font-size="9" class="mono">灯光 cue</text>
      </g>
      <path d="M232 188H272" stroke="#c18a2d" stroke-width="2"/>
      <circle cx="272" cy="188" r="4" fill="#c18a2d"/>

      <g transform="translate(0 264)">
        <rect width="350" height="116" fill="#fffdf8" stroke="#d3cabc"/>
        <text x="14" y="25" fill="#746c61" font-size="9" letter-spacing="2" class="mono">部门准备</text>
        <line x1="14" y1="37" x2="336" y2="37" stroke="#e6ded1"/>
        <text x="14" y="58" fill="#1c1917" font-size="12" class="sans">灯光　面光弱一档，暖色定点落在钥匙</text>
        <text x="14" y="82" fill="#1c1917" font-size="12" class="sans">音效　雨声从门口渐入</text>
        <text x="14" y="104" fill="#746c61" font-size="9" class="sans">来源：导演原话 · 保留待确认项</text>
      </g>
    </g>
  </g>

  <g transform="translate(112 632)">
    <rect width="86" height="5" fill="#151413"/>
    <rect x="86" width="86" height="5" fill="#40555e"/>
    <rect x="172" width="58" height="5" fill="#b23b32"/>
    <rect x="230" width="58" height="5" fill="#c18a2d"/>
    <rect x="288" width="38" height="5" fill="#f4f0e8"/>
    <text x="350" y="7" fill="#756b5f" font-size="9" class="mono">WORKLIGHT / 10 FAMILIES / 24 DIRECTORS</text>
  </g>
</svg>
